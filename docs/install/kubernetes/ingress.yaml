apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openmars
  labels:
    app.kubernetes.io/name: openmars
    app.kubernetes.io/part-of: openmars
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - <your-hostname>
      secretName: <your-tls-secret>
  rules:
    - host: <your-hostname>
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openmars
                port:
                  number: 3001
