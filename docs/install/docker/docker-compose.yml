services:
  app:
    image: ghcr.io/openmars-app/openmars:latest
    container_name: openmars
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - OPENMARS_LOG_LEVEL=${OPENMARS_LOG_LEVEL:-info}
      # Identity shown by a gateway that fronts several servers (lowercase a-z, 0-9, -)
      - OPENMARS_SERVER_ALIAS=${OPENMARS_SERVER_ALIAS:-local}
      - OPENMARS_SERVER_NAME=${OPENMARS_SERVER_NAME:-}
      # Bug reporting (optional -- game works without these)
      - GITHUB_APP_ID=${GITHUB_APP_ID:-}
      - GITHUB_INSTALLATION_ID=${GITHUB_INSTALLATION_ID:-}
      - GITHUB_PRIVATE_KEY_PATH=/etc/secrets/github/private-key.pem
      - GITHUB_REPO_OWNER=${GITHUB_REPO_OWNER:-}
      - GITHUB_REPO_NAME=${GITHUB_REPO_NAME:-}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
    volumes:
      # Mount your GitHub App private key here if using bug reporting.
      # Comment out if not needed.
      - ${GITHUB_PRIVATE_KEY_FILE:-/dev/null}:/etc/secrets/github/private-key.pem:ro
