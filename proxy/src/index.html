<!doctype html>
<html lang="en" spellcheck="false">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Terraforming Mars" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Digital implementation of the Terraforming Mars board game with real-time multiplayer"
    />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preload" href="/fonts/orbitron-bold.ttf" as="font" type="font/ttf" crossorigin />
    <title>Terraforming Mars CE</title>
    <style>
      /* Mirrors the game's main menu: frontend/src/index.css (.menu-shell,
         .game-button) and the title in GameLandingPage.tsx */
      @font-face {
        font-family: "Gateway Orbitron";
        src: url("/fonts/orbitron-medium.ttf") format("truetype");
        font-weight: 500;
        font-display: swap;
      }
      @font-face {
        font-family: "Gateway Orbitron";
        src: url("/fonts/orbitron-semibold.ttf") format("truetype");
        font-weight: 600;
        font-display: swap;
      }
      @font-face {
        font-family: "Gateway Orbitron";
        src: url("/fonts/orbitron-bold.ttf") format("truetype");
        font-weight: 700;
        font-display: swap;
      }

      #gateway {
        --orbitron: "Gateway Orbitron", sans-serif;
        --online: #4caa72;
        position: fixed;
        inset: 0;
        overflow-y: auto;
        background: #000;
        color: #fff;
        font-family: var(--orbitron);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        animation: gateway-in 300ms ease-out;
      }
      #gateway[hidden] {
        display: none;
      }
      @keyframes gateway-in {
        from {
          opacity: 0;
        }
      }

      #gateway .shell {
        box-sizing: border-box;
        width: min(1100px, calc(100% - 48px));
        min-height: 100dvh;
        margin: auto;
        padding: 100px 0 70px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      #gateway .intro {
        max-width: 520px;
        padding: 20px 0;
      }
      #gateway .title {
        margin: 0;
        font-size: clamp(2rem, 4vw, 4.5rem);
        font-weight: 700;
        line-height: 1.25;
        text-shadow: 0 0 30px rgb(30 60 150 / 80%);
      }
      #gateway .subtitle {
        margin: 12px 0 40px;
        color: rgb(255 255 255 / 45%);
        font-size: 0.8rem;
        font-weight: 500;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
      #gateway .notice {
        margin: 0 0 16px;
        color: rgb(255 255 255 / 60%);
        font-size: 0.8rem;
        font-weight: 500;
      }

      #gateway .notice[hidden],
      #gateway .servers li[hidden] {
        display: none;
      }

      #gateway .servers {
        margin: 0;
        padding: 0;
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
      }

      /* Secondary .game-button: cut corners, grey frame, dark fill */
      #gateway .server {
        --cut: 8px;
        --shape: polygon(
          0 0,
          calc(100% - var(--cut)) 0,
          100% var(--cut),
          100% 100%,
          var(--cut) 100%,
          0 calc(100% - var(--cut))
        );
        position: relative;
        isolation: isolate;
        width: 300px;
        min-height: 44px;
        display: grid;
        grid-template-columns: auto auto minmax(0, 1fr) auto auto;
        align-items: center;
        column-gap: 10px;
        padding: 0.65rem 1.1rem;
        border: 0;
        background: transparent;
        color: #f2f4fa;
        font-family: var(--orbitron);
        font-size: 0.8rem;
        font-weight: 600;
        text-align: left;
        cursor: pointer;
      }
      #gateway .server::before,
      #gateway .server::after {
        content: "";
        position: absolute;
        clip-path: var(--shape);
        transition: background 120ms;
      }
      #gateway .server::before {
        inset: 0;
        z-index: -2;
        background: #3c3c46;
      }
      #gateway .server::after {
        inset: 1px;
        z-index: -1;
        background: rgb(10 10 15 / 97%);
      }
      #gateway .server:not(:disabled):hover::before {
        background: #5a5f70;
      }
      #gateway .server:not(:disabled):hover::after {
        background: #14151c;
      }
      #gateway .server:focus-visible {
        outline: 2px solid #b6caff;
        outline-offset: 3px;
      }
      #gateway .server:disabled {
        cursor: default;
      }
      #gateway .server[data-status="down"] {
        opacity: 0.55;
      }

      #gateway .name {
        white-space: nowrap;
      }
      #gateway .version {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: rgb(255 255 255 / 40%);
        font-size: 0.7rem;
        font-weight: 500;
      }
      #gateway .current,
      #gateway .status {
        color: rgb(255 255 255 / 40%);
        font-size: 0.7rem;
        font-weight: 500;
        white-space: nowrap;
      }
      #gateway .version + .status {
        grid-column: 5;
      }

      /* Status marker: grey while checking, red when down, green and pulsing when online */
      #gateway .dot {
        position: relative;
        width: 7px;
        height: 7px;
        flex-shrink: 0;
        background: #555965;
      }
      #gateway .server[data-status="down"] .dot {
        background: #b94f56;
      }
      #gateway .server[data-status="online"] .dot {
        background: var(--online);
        box-shadow: 0 0 6px rgb(76 170 114 / 70%);
      }
      #gateway .server[data-status="online"] .dot::after {
        content: "";
        position: absolute;
        inset: -1px;
        border: 1px solid var(--online);
        opacity: 0;
        animation: gateway-pulse 2.4s ease-out infinite;
      }
      @keyframes gateway-pulse {
        0% {
          transform: scale(1);
          opacity: 0.35;
        }
        70%,
        100% {
          transform: scale(2.6);
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #gateway,
        #gateway .dot::after {
          animation: none;
        }
      }

      /* Phones: a top bar, then a plain list with dividers */
      @media (max-width: 640px), (max-height: 500px) {
        #gateway .shell {
          width: 100%;
          min-height: 100dvh;
          padding: 0;
          justify-content: flex-start;
        }
        #gateway .intro {
          position: sticky;
          top: 0;
          z-index: 1;
          max-width: none;
          display: flex;
          align-items: baseline;
          flex-wrap: wrap;
          gap: 4px 12px;
          padding: calc(14px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
            14px calc(16px + env(safe-area-inset-left));
          background: #000;
          border-bottom: 1px solid rgb(255 255 255 / 10%);
        }
        #gateway .title {
          font-size: 1rem;
          letter-spacing: 0.05em;
        }
        #gateway .title br {
          display: none;
        }
        #gateway .subtitle {
          margin: 0;
          font-size: 0.7rem;
        }
        #gateway .choices {
          padding: 0 calc(16px + env(safe-area-inset-right)) env(safe-area-inset-bottom)
            calc(16px + env(safe-area-inset-left));
        }
        #gateway .notice {
          margin: 14px 0 0;
        }
        #gateway .servers {
          display: block;
        }
        #gateway .servers li {
          border-bottom: 1px solid rgb(255 255 255 / 10%);
        }
        #gateway .server {
          width: 100%;
          min-height: 48px;
          padding: 0 4px;
        }
        #gateway .server::before,
        #gateway .server::after {
          content: none;
        }
        #gateway .server:not(:disabled):active {
          background: rgb(255 255 255 / 5%);
        }
      }
    </style>
  </head>
  <body style="background-color: #000000; margin: 0">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <main id="gateway" hidden></main>
    <div id="root"></div>
    <script src="/servers.js"></script>
    <script type="module" src="/%LOADER%"></script>
  </body>
</html>
