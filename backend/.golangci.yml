version: "2"

# Architecture guardrail. This config intentionally enables ONLY depguard so it can
# be wired into `just backend lint`/CI without surfacing unrelated lint findings. It encodes
# the layer dependency direction the codebase already follows, so the compiler's
# native cycle rejection is backed by a machine-checked direction rule.
#
#   game (domain)  <-  action (use cases)  <-  delivery (transport)
#
# The domain must never import outward layers. Since Phase 2, zap is removed from
# the entire backend — everything logs via stdlib log/slog — so a module-wide rule
# forbids reintroducing it, and the domain additionally must not touch the logger
# package.

linters:
  default: none
  enable:
    - depguard
  settings:
    depguard:
      rules:
        no-zap:
          files:
            - "**/*.go"
          deny:
            - pkg: go.uber.org/zap
              desc: "zap has been removed from the backend — log via stdlib log/slog"
        domain:
          files:
            - "**/internal/game/**"
          deny:
            - pkg: openmars/internal/action
              desc: "domain (internal/game) must not import the action layer — keep game <- action direction"
            - pkg: openmars/internal/delivery
              desc: "domain (internal/game) must not import the delivery layer — keep game <- delivery direction"
            - pkg: openmars/internal/logger
              desc: "domain (internal/game) must not depend on the logger package — log via stdlib log/slog"
        usecases:
          files:
            - "**/internal/action/**"
          deny:
            - pkg: openmars/internal/delivery
              desc: "action (use cases) must not import the delivery layer — keep action <- delivery direction"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
