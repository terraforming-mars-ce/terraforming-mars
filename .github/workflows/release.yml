name: Release

# Pushing a vMAJOR.MINOR.PATCH tag (`just release`) builds every image and opens
# a draft GitHub release whose notes are built from changelog/<tag>/: the player
# notes (CHANGELOG-USER.md), then the developer notes (CHANGELOG.md) under
# "Developer details". Nothing is built or released for a tag without both
# files. Deploys stay manual.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

env:
  REGISTRY: ghcr.io
  GO_VERSION: '1.27.2'

jobs:
  changelog:
    name: Check changelog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Check changelog/${{ github.ref_name }}
        working-directory: ./backend
        run: go run ./cmd/changelog check ../changelog "$GITHUB_REF_NAME"

  draft-release:
    name: Create draft release
    needs: changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Build release notes
        working-directory: ./backend
        run: go run ./cmd/changelog release-notes ../changelog "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/release-notes.md"

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md

  build-and-push:
    name: Build & Push ${{ matrix.name }} image
    needs: changelog
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: app
            suffix: ''
            context: .
            file: ./Dockerfile
            lfs: true
          - name: proxy
            suffix: -proxy
            context: .
            file: ./proxy/Dockerfile
            lfs: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          lfs: ${{ matrix.lfs }}

      - name: Compute build version
        id: version
        run: |
          GIT_DESCRIBE=$(git describe --tags --always)
          if echo "$GIT_DESCRIBE" | grep -q '-'; then
            TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            BUILD_VERSION="${GIT_DESCRIBE}_${TIMESTAMP}"
          else
            BUILD_VERSION="$GIT_DESCRIBE"
          fi
          echo "build_version=$BUILD_VERSION" >> "$GITHUB_OUTPUT"

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}${{ matrix.suffix }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0
        with:
          image: mirror.gcr.io/tonistiigi/binfmt:latest

      # Shared runners pull from Docker Hub anonymously and get rate limited or time
      # out, so every pull goes through Google's public Docker Hub mirror: the QEMU
      # and BuildKit images here, and base images via the BuildKit mirror config
      # (Docker Hub stays the fallback for images the mirror lacks)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.build_version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
