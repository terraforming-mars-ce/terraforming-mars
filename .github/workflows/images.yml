name: Build Images

on:
  release:
    types: [published]
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push ${{ matrix.name }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            suffix: -backend
            context: .
            file: backend/Dockerfile
            lfs: false
          - name: frontend
            suffix: -frontend
            context: .
            file: ./frontend/Dockerfile
            lfs: true
          - name: proxy
            suffix: -proxy
            context: .
            file: ./proxy/Dockerfile
            lfs: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          lfs: ${{ matrix.lfs }}

      - name: Compute build version
        id: version
        run: |
          GIT_DESCRIBE=$(git describe --tags --always)
          if echo "$GIT_DESCRIBE" | grep -q '-'; then
            TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            BUILD_VERSION="${GIT_DESCRIBE}_${TIMESTAMP}"
          else
            BUILD_VERSION="$GIT_DESCRIBE"
          fi
          echo "build_version=$BUILD_VERSION" >> "$GITHUB_OUTPUT"

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}${{ matrix.suffix }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.build_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
