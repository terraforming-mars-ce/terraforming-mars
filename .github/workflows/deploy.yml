name: Deploy

# Deploys only when started by hand. Images come from the Build Images workflow;
# pick the version to run, or "latest" for the newest release.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        required: true
        type: choice
        options:
          - gateway
          - pi
      version:
        description: Image version (latest or x.y.z)
        required: true
        default: latest

jobs:
  deploy-gateway:
    name: Deploy gateway (openmars.app)
    if: inputs.target == 'gateway'
    runs-on: ubuntu-latest
    environment: gateway
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^(latest|[0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "Invalid version: $VERSION"; exit 1; }

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.GATEWAY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.GATEWAY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The key can only run tm-gateway-deploy, which reads the gateway config from stdin
      - name: Deploy
        env:
          VERSION: ${{ inputs.version }}
        run: |
          tar -C proxy/deploy -c Caddyfile gateway.env tm-gateway.service \
            | ssh -o StrictHostKeyChecking=yes deploy@openmars.app "deploy $VERSION"

  deploy-pi:
    name: Deploy to Raspberry Pi
    if: inputs.target == 'pi'
    runs-on: ubuntu-latest
    environment: raspberry-pi
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^(latest|[0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "Invalid version: $VERSION"; exit 1; }

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PI_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # TM_VERSION takes effect once the Pi's compose file uses
      # ${TM_VERSION:-latest} as its image tag
      - name: Deploy
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ssh -o StrictHostKeyChecking=yes mhm@ssh.mh-hemma.rackaracka.net \
            "cd /home/mhm/terraforming-mars && export TM_VERSION=$VERSION && docker compose pull && docker compose up -d && docker image prune -f"
