name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  GO_VERSION: '1.27.1'

jobs:
  format-check:
    runs-on: ubuntu-latest
    name: Format Check
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            backend/go.sum
            backend/golangci-lint.sum

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.10.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2

      - name: Download Go modules
        working-directory: ./backend
        run: go mod download

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: bun install --frozen-lockfile

      - name: Set up just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: '1.57.0'

      - name: Check formatting
        run: just format-check

      - name: Check generated types are up to date
        run: just generate-check

  backend-lint:
    runs-on: ubuntu-latest
    name: Backend Lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            backend/go.sum
            backend/golangci-lint.sum

      - name: Download Go modules
        working-directory: ./backend
        run: go mod download

      - name: Set up just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: '1.57.0'

      - name: Run go vet, errcheck and golangci-lint
        run: just backend lint

  backend-tests:
    runs-on: ubuntu-latest
    name: Backend Tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            backend/go.sum
            backend/golangci-lint.sum

      - name: Download Go modules
        working-directory: ./backend
        run: go mod download

      - name: Set up just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: '1.57.0'

      - name: Run all backend tests
        run: just backend test

  frontend-lint:
    runs-on: ubuntu-latest
    name: Frontend Lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.10.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: bun install --frozen-lockfile

      - name: Set up just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: '1.57.0'

      - name: Run frontend lint
        run: just frontend lint

  frontend-typecheck:
    runs-on: ubuntu-latest
    name: Frontend TypeCheck
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.10.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: bun install --frozen-lockfile

      - name: Set up just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: '1.57.0'

      - name: Run TypeScript type check
        run: just frontend typecheck

  frontend-build:
    runs-on: ubuntu-latest
    name: Frontend Build
    needs: [frontend-lint, frontend-typecheck]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.10.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: bun install --frozen-lockfile

      - name: Set up just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: '1.57.0'

      - name: Validate asset pipeline
        run: just frontend::assets-test frontend::assets-check

      - name: Build frontend for production
        run: just frontend build

      - name: Upload frontend build
        uses: actions/upload-artifact@v7.0.1
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 7

  coverage:
    runs-on: ubuntu-latest
    name: Coverage Report
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            backend/go.sum
            backend/golangci-lint.sum

      - name: Set up just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: '1.57.0'

      - name: Run tests with coverage
        run: just backend coverage

      - name: Assemble Pages content
        working-directory: backend
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Coverage: ${COVERAGE}%"
          mkdir -p pages
          cp coverage.html pages/index.html

          if (( $(echo "$COVERAGE >= 80" | bc -l) )); then
            COLOR="brightgreen"
          elif (( $(echo "$COVERAGE >= 60" | bc -l) )); then
            COLOR="green"
          elif (( $(echo "$COVERAGE >= 40" | bc -l) )); then
            COLOR="yellow"
          else
            COLOR="red"
          fi

          echo "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"${COVERAGE}%\",\"color\":\"${COLOR}\"}" > pages/coverage.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: backend/pages

  # Publish the coverage report to GitHub Pages, but only for pushes to main.
  deploy-coverage-pages:
    needs: coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Publish Coverage to Pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
